name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/playground/**"
      - "packages/core/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stylex-variants/core build
      - run: pnpm --filter playground build --base=/stylex-variants/playground/
      - run: pnpm --filter docs build
      - name: Include playground in the documentation site
        run: |
          mkdir -p apps/docs/build/playground
          cp -R apps/playground/dist/. apps/docs/build/playground/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
